<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TETRIS — White Background (Touch & Keyboard)</title>
  <style>
    :root{
      --bg:#ffffff; /* 白背景 */
      --panel:#f4fbff; /* 薄い寒色パネル */
      --accent:#66b8ff; /* メインアクセント */
      --muted:#87a7c7; /* 補助色 */
      --card:#f7fbff;
      --shadow: 0 6px 20px rgba(30,60,90,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN",Meiryo,Arial;color:#244a6b;background:var(--bg)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}

    /* レイアウトは最初のまま（左右2カラム） */
    .game{
      display:grid;grid-template-columns: 320px 220px;gap:18px;align-items:start;
      width:calc(320px + 220px + 18px);
      max-width:calc(100% - 40px);
    }

    .board-wrap{background:var(--card);padding:14px;border-radius:14px;box-shadow:var(--shadow);}    
    canvas{background:linear-gradient(180deg,#fbfeff,#f3fbff);display:block;border-radius:8px}

    .panel{background:var(--panel);padding:14px;border-radius:12px;color:var(--muted);box-shadow:var(--shadow)}
    .panel h1{color:var(--accent);margin:0 0 10px;font-size:18px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .stat{background:rgba(255,255,255,0.6);padding:8px;border-radius:8px;text-align:center}
    .stat b{display:block;color:#123a57;font-size:18px}
    .next{display:flex;flex-direction:column;align-items:center}
    .next canvas{width:100px;height:100px;margin-top:6px;background:transparent}

    .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .btn{background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(230,245,255,0.9));border:1px solid rgba(100,150,200,0.12);padding:10px;border-radius:10px;text-align:center;user-select:none;touch-action:manipulation}
    .btn:active{transform:scale(0.98)}
    .big{grid-column:span 3}
    .kbd{font-size:12px;color:var(--muted)}

    /* タッチ操作用レイヤ */
    .touch-layer{position:relative}
    .touch-areas{position:absolute;inset:0;display:flex}
    .touch-left,.touch-right{flex:1}
    .touch-center{width:120px}
    .touch-area{height:100%;}

    .mobile-controls{display:none;margin-top:10px;gap:8px}
    .mobile-controls .row{display:flex;gap:8px}
    .control-btn{flex:1;padding:12px;border-radius:10px;background:linear-gradient(180deg,#eaf8ff,#dff4ff);text-align:center}

    @media (max-width:720px){
      .game{grid-template-columns:1fr;gap:12px;width:100%}
      .panel{order:2}
      .mobile-controls{display:block}
      .controls{display:none}
      canvas{width:100%;height:auto}
    }

    footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="game">
      <div class="board-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="color:var(--muted)">TETRIS</div>
          <div style="color:var(--muted);font-size:13px">Score <span id="score">0</span></div>
        </div>

        <div class="touch-layer">
          <canvas id="board" width="320" height="640"></canvas>
          <div class="touch-areas" id="touchAreas">
            <div class="touch-left touch-area" id="ta-left"></div>
            <div class="touch-center touch-area" id="ta-center"></div>
            <div class="touch-right touch-area" id="ta-right"></div>
          </div>
        </div>

        <div class="mobile-controls">
          <div class="row">
            <div class="control-btn" id="m-left">◀</div>
            <div class="control-btn" id="m-down">▼</div>
            <div class="control-btn" id="m-right">▶</div>
          </div>
          <div class="row" style="margin-top:8px">
            <div class="control-btn" id="m-rotate">⟳</div>
            <div class="control-btn" id="m-drop">Drop</div>
            <div class="control-btn" id="m-pause">Pause</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h1>Info</h1>
        <div class="stats">
          <div class="stat">Level<br><b id="level">1</b></div>
          <div class="stat">Lines<br><b id="lines">0</b></div>
        </div>
        <div class="next">
          <div style="color:var(--muted);font-size:13px">Next</div>
          <canvas id="next" width="100" height="100"></canvas>
        </div>

        <div style="margin-top:12px">
          <div style="color:var(--muted);font-size:13px;margin-bottom:6px">Controls</div>
          <div class="controls">
            <div class="btn" id="btn-left">◀<div class="kbd">← / A</div></div>
            <div class="btn" id="btn-rotate">⟳<div class="kbd">↑ / W / Space</div></div>
            <div class="btn" id="btn-right">▶<div class="kbd">→ / D</div></div>
            <div class="btn" id="btn-down">▼<div class="kbd">↓ / S</div></div>
            <div class="btn big" id="btn-drop">Hard Drop<div class="kbd">Space</div></div>
            <div class="btn" id="btn-pause">Pause<div class="kbd">P</div></div>
          </div>
        </div>
        <footer>Tap center to rotate. Swipe left/right to move. Swipe down to drop faster.</footer>
      </div>
    </div>
  </div>

  <script>
  // --- Tetris single-file implementation with white background + extended pastel palette ---
  const COLS = 10, ROWS = 20, BLOCK = 32;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');

  // scale for crisp look on high-dpi
  const DPR = Math.max(1, window.devicePixelRatio || 1);
  [boardCanvas, nextCanvas].forEach(c=>{
    const cssW = c.width, cssH = c.height;
    c.width = cssW * DPR; c.height = cssH * DPR;
    c.style.width = (cssW) + 'px'; c.style.height = (cssH) + 'px';
    c.getContext('2d').scale(DPR, DPR);
  });

  // COLORS: index 0 is empty (null), 1..7 map to tetromino ids
  const COLORS = [
    null,
    '#a3d9ff', // 1: I - light cyan
    '#ffd8b7', // 2: Z - pastel peach
    '#b5e7c8', // 3: S - mint
    '#c7b3ff', // 4: J - lavender
    '#fff1a8', // 5: L - pale yellow
    '#ffccd5', // 6: O - pastel pink
    '#d5b3ff'  // 7: T - lilac
  ];

  const SHAPES = [
    [],
    [[1,1,1,1]], // I
    [[2,2,0],[0,2,2]], // Z
    [[0,3,3],[3,3,0]], // S
    [[4,0,0],[4,4,4]], // J
    [[0,0,5],[5,5,5]], // L
    [[6,6],[6,6]], // O
    [[0,7,0],[7,7,7]] // T
  ];

  function rotate(matrix){
    const m = matrix.map(r=>r.slice());
    const N = m.length; const res = Array.from({length:N},()=>Array(N).fill(0));
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) res[x][N-1-y]=m[y][x];
    return res;
  }

  function normalize(shape){
    const h = shape.length, w = Math.max(...shape.map(r=>r.length));
    const N = Math.max(h,w);
    const m = Array.from({length:N},()=>Array(N).fill(0));
    for(let y=0;y<h;y++) for(let x=0;x<shape[y].length;x++) m[y][x]=shape[y][x];
    return m;
  }

  function rotatePad(mat){
    const r = rotate(mat);
    return trim(r);
  }
  function trim(mat){
    let top=0,bottom=mat.length-1,left=0,right=mat[0].length-1;
    while(top<=bottom && mat[top].every(v=>v===0)) top++;
    while(bottom>=top && mat[bottom].every(v=>v===0)) bottom--;
    while(left<=right && mat.every(r=>r[left]===0)) left++;
    while(right>=left && mat.every(r=>r[right]===0)) right--;
    const out = [];
    for(let y=top;y<=bottom;y++) out.push(mat[y].slice(left,right+1));
    return out.length?out:[[0]];
  }

  function makeMatrix(cols,rows){
    return Array.from({length:rows},()=>Array(cols).fill(0));
  }

  class Piece{
    constructor(id){
      this.id=id||(Math.floor(Math.random()*7)+1);
      this.matrix = normalize(SHAPES[this.id]);
      this.x = Math.floor((COLS - this.matrix[0].length)/2);
      this.y = -this.matrix.length + 1;
    }
    rotate(){ this.matrix = rotatePad(this.matrix); }
  }

  // game state
  let grid = makeMatrix(COLS, ROWS);
  let current = new Piece();
  let next = new Piece();
  let score=0, level=1, lines=0;
  let dropInterval = 800; let lastDrop = 0; let paused=false, gameover=false;

  function collide(grid,piece,offsetX=0,offsetY=0){
    for(let y=0;y<piece.matrix.length;y++){
      for(let x=0;x<piece.matrix[y].length;x++){
        if(!piece.matrix[y][x]) continue;
        const gx = piece.x + x + offsetX;
        const gy = piece.y + y + offsetY;
        if(gx<0 || gx>=COLS || gy>=ROWS) return true;
        if(gy>=0 && grid[gy][gx]) return true;
      }
    }
    return false;
  }

  function merge(grid,piece){
    for(let y=0;y<piece.matrix.length;y++){
      for(let x=0;x<piece.matrix[y].length;x++){
        if(!piece.matrix[y][x]) continue;
        const gx = piece.x + x; const gy = piece.y + y;
        if(gy>=0) grid[gy][gx] = piece.matrix[y][x];
      }
    }
  }

  function sweep(){
    let rowCount=0;
    outer: for(let y=ROWS-1;y>=0;y--){
      for(let x=0;x<COLS;x++) if(!grid[y][x]) continue outer;
      // full row
      grid.splice(y,1);
      grid.unshift(Array(COLS).fill(0));
      rowCount++; y++; // re-check same y
    }
    if(rowCount>0){
      lines += rowCount;
      score += (rowCount*100) * rowCount * level;
      level = Math.floor(lines/10)+1;
      dropInterval = Math.max(80, 800 - (level-1)*60);
      updateHUD();
    }
  }

  function updateHUD(){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function spawn(){
    current = next; next = new Piece();
    current.x = Math.floor((COLS - current.matrix[0].length)/2);
    current.y = -current.matrix.length + 1;
    if(collide(grid,current)) { gameover=true; paused=true; }
  }

  function hardDrop(){
    while(!collide(grid,current,0,1)){ current.y++; }
    lockPiece();
  }

  function lockPiece(){
    merge(grid,current);
    sweep();
    spawn();
  }

  function move(dir){
    if(!current) return;
    if(!collide(grid,current,dir,0)) current.x += dir;
  }

  function rotateCurrent(){
    const old = current.matrix;
    current.matrix = rotatePad(current.matrix);
    // wall kick simple
    if(collide(grid,current)){
      if(!collide(grid,current,-1)) current.x--;
      else if(!collide(grid,current,1)) current.x++;
      else current.matrix = old;
    }
  }

  function softDrop(){
    if(!collide(grid,current,0,1)) current.y++;
    else lockPiece();
  }

  // drawing
  function drawCell(x,y,val,ctxBoard){
    if(!val) return;
    ctxBoard.fillStyle = COLORS[val];
    ctxBoard.fillRect(x*BLOCK+1,y*BLOCK+1,BLOCK-2,BLOCK-2);
    ctxBoard.strokeStyle = 'rgba(0,0,0,0.06)';
    ctxBoard.strokeRect(x*BLOCK+1,y*BLOCK+1,BLOCK-2,BLOCK-2);
  }

  function draw(){
    // board background
    ctx.clearRect(0,0,boardCanvas.width/DPR,boardCanvas.height/DPR);
    ctx.fillStyle = 'rgba(255,255,255,0.0)';
    ctx.fillRect(0,0,COLS*BLOCK,ROWS*BLOCK);

    // grid existing
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) drawCell(x,y,grid[y][x],ctx);
    // current piece
    if(current){
      for(let y=0;y<current.matrix.length;y++) for(let x=0;x<current.matrix[y].length;x++){
        if(current.matrix[y][x]){
          const gx = current.x + x; const gy = current.y + y;
          if(gy>=0) drawCell(gx,gy,current.matrix[y][x],ctx);
        }
      }
    }

    // draw grid lines
    ctx.strokeStyle = 'rgba(30,80,120,0.04)';
    for(let x=0;x<=COLS;x++){
      ctx.beginPath(); ctx.moveTo(x*BLOCK,0); ctx.lineTo(x*BLOCK,ROWS*BLOCK); ctx.stroke();
    }
    for(let y=0;y<=ROWS;y++){
      ctx.beginPath(); ctx.moveTo(0,y*BLOCK); ctx.lineTo(COLS*BLOCK,y*BLOCK); ctx.stroke();
    }
  }

  function drawNext(){
    nctx.clearRect(0,0,nextCanvas.width/DPR,nextCanvas.height/DPR);
    const offsetX = 2; const offsetY = 2;
    for(let y=0;y<next.matrix.length;y++) for(let x=0;x<next.matrix[y].length;x++){
      if(next.matrix[y][x]){
        nctx.fillStyle = COLORS[next.matrix[y][x]];
        nctx.fillRect((x+offsetX)*BLOCK/2,(y+offsetY)*BLOCK/2,BLOCK/2-2,BLOCK/2-2);
      }
    }
  }

  // game loop
  let lastTime = 0;
  function loop(time=0){
    if(!lastTime) lastTime = time; const delta = time - lastTime; lastTime = time;
    if(!paused && !gameover){
      lastDrop += delta;
      if(lastDrop > dropInterval){ softDrop(); lastDrop = 0; }
    }
    draw(); drawNext();
    requestAnimationFrame(loop);
  }

  // input handlers
  document.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    if(e.key==='ArrowLeft' || e.key==='a') move(-1);
    else if(e.key==='ArrowRight' || e.key==='d') move(1);
    else if(e.key==='ArrowDown' || e.key==='s') softDrop();
    else if(e.key===' ' || e.key==='w' || e.key==='ArrowUp') { rotateCurrent(); }
    else if(e.key==='p') { paused = !paused; }
    else if(e.key==='Enter') { hardDrop(); }
  });

  // UI buttons
  function bindBtn(id,fn){ const el = document.getElementById(id); el.addEventListener('pointerdown', e=>{ e.preventDefault(); fn(); }); }
  bindBtn('btn-left',()=>move(-1)); bindBtn('btn-right',()=>move(1)); bindBtn('btn-rotate',()=>rotateCurrent()); bindBtn('btn-down',()=>softDrop()); bindBtn('btn-drop',()=>hardDrop()); bindBtn('btn-pause',()=>{ paused=!paused; });
  ['m-left','m-right','m-rotate','m-drop','m-down','m-pause'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('click',()=>{ if(id==='m-left') move(-1); if(id==='m-right') move(1); if(id==='m-rotate') rotateCurrent(); if(id==='m-drop') hardDrop(); if(id==='m-down') softDrop(); if(id==='m-pause') paused=!paused; }); });

  // Touch gestures over canvas
  (function touchGestures(){
    const taLeft = document.getElementById('ta-left');
    const taCenter = document.getElementById('ta-center');
    const taRight = document.getElementById('ta-right');
    let startX=0,startY=0,startTime=0;
    function start(e){
      const p = getPoint(e);
      startX = p.x; startY = p.y; startTime = Date.now();
    }
    function end(e,side){
      const p = getPoint(e); const dx = p.x - startX, dy = p.y - startY; const adx = Math.abs(dx), ady = Math.abs(dy);
      // swipe thresholds
      if( adx>30 && adx>ady ){ if(dx>0) move(1); else move(-1); }
      else if( ady>30 && ady>adx ){ if(dy>0) softDrop(); else rotateCurrent(); }
      else { // tap
        if(side==='center') rotateCurrent();
        else if(side==='left') move(-1);
        else move(1);
      }
    }
    function getPoint(e){ const t = e.changedTouches ? e.changedTouches[0] : e; return {x:t.clientX, y:t.clientY}; }
    ['pointerdown','touchstart','mousedown'].forEach(ev=>{ taLeft.addEventListener(ev,start); taRight.addEventListener(ev,start); taCenter.addEventListener(ev,start); });
    ['pointerup','touchend','mouseup'].forEach(ev=>{ taLeft.addEventListener(ev,(e)=>end(e,'left')); taRight.addEventListener(ev,(e)=>end(e,'right')); taCenter.addEventListener(ev,(e)=>end(e,'center')); });

    // swipe down on whole canvas for faster drop
    const board = document.getElementById('board');
    let bsx=0,bsy=0;
    board.addEventListener('pointerdown',(e)=>{ bsx=e.clientX; bsy=e.clientY; });
    board.addEventListener('pointerup',(e)=>{ const dx=e.clientX-bsx, dy=e.clientY-bsy; if(Math.abs(dy)>60 && dy>0) { // big swipe down = hard drop
      hardDrop();
    } else if(Math.abs(dy)>20 && dy>0){ softDrop(); } });

  })();

  // init
  next = new Piece(); spawn(); updateHUD(); loop();

  // restart helper
  window.restart = ()=>{
    grid = makeMatrix(COLS,ROWS);
    current = new Piece(); next = new Piece(); score=0; level=1; lines=0; dropInterval=800; paused=false; gameover=false; updateHUD();
    spawn();
  };
  </script>
</body>
</html>
